<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Virtual mall 3D yang bisa dijelajahi dengan space / unit ritel yang bisa disewa secara online.">
<title>Wolfpup Virtual Mall — Sewa Space Ritel</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --bg:#0b0d12;
    --panel:rgba(16,19,27,.88);
    --panel-solid:#111420;
    --stroke:rgba(255,255,255,.10);
    --stroke-strong:rgba(255,255,255,.22);
    --text:#eef1f7;
    --muted:#9aa3b5;
    --brand:#ffb020;
    --brand-2:#ff7a45;
    --ok:#36d399;
    --booked:#5aa9ff;
    --rented:#ff5d7a;
    --radius:14px;
    --shadow:0 18px 50px rgba(0,0,0,.45);
    font-synthesis-weight:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    overscroll-behavior:none;}
  a{color:var(--brand)}
  a-scene{position:fixed;inset:0}

  /* ---------- overlay shell ---------- */
  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column}
  #ui .pe{pointer-events:auto}

  /* ---------- top bar ---------- */
  #topbar{position:relative;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 14px;
    background:linear-gradient(180deg,rgba(8,10,15,.92),rgba(8,10,15,0));}
  /* bidang kosong topbar tidak boleh menelan klik panel di bawahnya */
  #topbar.pe{pointer-events:none}
  #topbar > *{pointer-events:auto}
  #stats{pointer-events:none}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .mark{width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;color:#241500;font-weight:800;font-size:15px;letter-spacing:-.5px}
  .brand h1{font-size:15px;margin:0;line-height:1.15;white-space:nowrap}
  .brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
  #stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .stat{background:var(--panel);border:1px solid var(--stroke);border-radius:12px;
    padding:6px 11px;min-width:76px;backdrop-filter:blur(12px)}
  .stat b{display:block;font-size:16px;line-height:1.1}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stat.ok b{color:var(--ok)} .stat.rent b{color:var(--rented)} .stat.book b{color:var(--booked)}
  .btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;
    background:var(--panel);border:1px solid var(--stroke);border-radius:11px;padding:8px 12px;
    backdrop-filter:blur(12px);transition:.16s ease;white-space:nowrap}
  .btn:hover{border-color:var(--stroke-strong);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#241500;border-color:transparent}
  .btn.ghost{background:rgba(255,255,255,.04)}
  .btn.danger{background:rgba(255,93,122,.14);border-color:rgba(255,93,122,.35);color:#ffb3c1}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  /* ---------- sidebar ---------- */
  #sidebar{position:absolute;z-index:3;top:64px;left:14px;bottom:14px;width:328px;max-width:calc(100vw - 28px);
    background:var(--panel);border:1px solid var(--stroke);border-radius:var(--radius);
    box-shadow:var(--shadow);backdrop-filter:blur(16px);display:flex;flex-direction:column;overflow:hidden;
    transition:transform .25s ease,opacity .25s ease}
  #sidebar.hidden{transform:translateX(-118%);opacity:0;pointer-events:none}
  .side-head{padding:12px 12px 8px;border-bottom:1px solid var(--stroke)}
  .side-head h2{margin:0 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  #search{width:100%;font:inherit;font-size:13px;color:var(--text);background:rgba(255,255,255,.05);
    border:1px solid var(--stroke);border-radius:10px;padding:9px 11px;outline:none}
  #search:focus{border-color:var(--brand)}
  .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;
    border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--muted);transition:.15s}
  .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#241500}
  #unitlist{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  #unitlist::-webkit-scrollbar{width:8px}
  #unitlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  .card{border:1px solid var(--stroke);border-radius:12px;background:rgba(255,255,255,.035);padding:10px 11px}
  .card:hover{border-color:var(--stroke-strong);background:rgba(255,255,255,.06)}
  .card .row{display:flex;align-items:baseline;gap:8px}
  .card h3{margin:0;font-size:13.5px}
  .card .cat{font-size:11px;color:var(--muted)}
  .card .price{margin-top:5px;font-size:13px;font-weight:700;color:var(--brand)}
  .card .price small{font-weight:500;color:var(--muted);font-size:11px}
  .card .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
  .card .acts{display:flex;gap:6px;margin-top:9px}
  .card .acts .btn{padding:6px 10px;font-size:11.5px;flex:1}
  .badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;white-space:nowrap}
  .badge.available{background:rgba(54,211,153,.16);color:var(--ok)}
  .badge.rented{background:rgba(255,93,122,.16);color:var(--rented)}
  .badge.booked{background:rgba(90,169,255,.16);color:var(--booked)}
  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:24px 8px}

  /* ---------- minimap ---------- */
  #mapwrap{position:absolute;z-index:3;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--stroke);
    border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(16px);padding:9px;
    transition:transform .25s ease,opacity .25s ease}
  #mapwrap.hidden{transform:translateY(130%);opacity:0;pointer-events:none}
  #mapwrap .cap{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
    display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
  #minimap{display:block;border-radius:8px;background:rgba(0,0,0,.35)}

  /* ---------- gaze hint ---------- */
  #hint{position:absolute;z-index:4;left:50%;top:calc(50% + 42px);transform:translateX(-50%);
    background:rgba(8,10,15,.86);border:1px solid var(--stroke);border-radius:10px;padding:7px 12px;
    font-size:12.5px;white-space:nowrap;opacity:0;transition:opacity .15s;backdrop-filter:blur(8px)}
  #hint.show{opacity:1}
  #hint b{color:var(--brand)}
  kbd{background:rgba(255,255,255,.12);border:1px solid var(--stroke-strong);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;font-size:10.5px;font-family:ui-monospace,Menlo,Consolas,monospace}

  /* ---------- modal ---------- */
  #modal,#pmodal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;
    background:rgba(4,6,10,.62);backdrop-filter:blur(4px)}
  #modal.open,#pmodal.open{display:flex}
  .sheet{width:min(560px,100%);max-height:min(86vh,760px);overflow-y:auto;background:var(--panel-solid);
    border:1px solid var(--stroke);border-radius:18px;box-shadow:var(--shadow)}
  .sheet-head{padding:16px 18px;border-bottom:1px solid var(--stroke);display:flex;gap:12px;align-items:flex-start}
  .sheet-head h2{margin:0;font-size:19px}
  .sheet-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
  .sheet-body{padding:16px 18px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
  .kv div{background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:11px;padding:9px 11px}
  .kv span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .kv b{font-size:14px;font-weight:700}
  .facil{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .facil em{font-style:normal;font-size:11.5px;color:var(--muted);border:1px solid var(--stroke);
    border-radius:999px;padding:4px 9px}
  form label{display:block;font-size:11.5px;color:var(--muted);margin:0 0 4px;font-weight:600}
  form .f{margin-bottom:11px}
  form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  input,select,textarea{width:100%;font:inherit;font-size:13px;color:var(--text);
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:10px;padding:9px 11px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  select option{background:var(--panel-solid)}
  textarea{resize:vertical;min-height:62px}
  .summary{border:1px dashed var(--stroke-strong);border-radius:12px;padding:11px 13px;margin:6px 0 14px;
    font-size:12.5px;color:var(--muted)}
  .summary .line{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
  .summary .line b{color:var(--text);font-weight:600}
  .summary .total{border-top:1px solid var(--stroke);margin-top:7px;padding-top:7px;font-size:15px;color:var(--text)}
  .summary .total b{color:var(--brand);font-size:17px}
  .sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 18px;flex-wrap:wrap}
  .note{font-size:11.5px;color:var(--muted);line-height:1.5}

  /* ---------- toast ---------- */
  #toasts{position:absolute;z-index:55;left:50%;bottom:22px;transform:translateX(-50%);display:flex;
    flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
  .toast{background:var(--panel-solid);border:1px solid var(--stroke-strong);border-radius:12px;
    padding:10px 14px;font-size:13px;box-shadow:var(--shadow);animation:pop .25s ease}
  .toast.good{border-color:rgba(54,211,153,.5)}
  .toast.warn{border-color:rgba(255,176,32,.5)}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- joystick ---------- */
  #joy{position:absolute;z-index:4;left:18px;bottom:18px;width:124px;height:124px;border-radius:50%;
    border:1px solid var(--stroke);background:rgba(16,19,27,.5);display:none;touch-action:none}
  #joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));opacity:.85}
  body.touch #joy{display:block}

  /* ---------- welcome ---------- */
  #welcome{position:absolute;z-index:60;inset:0;display:grid;place-items:center;padding:16px;
    background:radial-gradient(1200px 600px at 50% 0%,rgba(255,176,32,.10),transparent 60%),rgba(4,6,10,.86)}
  #welcome .sheet{max-width:520px;text-align:left}
  #welcome ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.75}
  #welcome ul b{color:var(--text)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

  /* ---------- language toggle ---------- */
  .seg{display:flex;background:var(--panel);border:1px solid var(--stroke);border-radius:11px;overflow:hidden;backdrop-filter:blur(12px)}
  .seg button{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);
    background:transparent;border:0;padding:8px 10px;cursor:pointer;transition:.15s}
  .seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#241500}

  /* ---------- sidebar tabs ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:9px}
  .tabs button{flex:1;font:inherit;font-size:12px;font-weight:700;padding:7px 8px;border-radius:10px;cursor:pointer;
    color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--stroke);transition:.15s}
  .tabs button[aria-pressed="true"]{color:var(--text);background:rgba(255,176,32,.16);border-color:rgba(255,176,32,.45)}
  .card .shop{font-size:11px;color:var(--muted)}
  .card .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

  /* ---------- product / AR sheet ---------- */
  model-viewer{width:100%;height:min(46vh,340px);background:linear-gradient(180deg,#171b26,#0e1118);
    border-radius:14px;border:1px solid var(--stroke);--poster-color:transparent}
  .ar-btn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#241500;border:0;border-radius:999px;
    font:inherit;font-size:13px;font-weight:700;padding:10px 18px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .mv-wrap{position:relative;margin-bottom:14px}
  .mv-note{font-size:11.5px;color:var(--muted);margin:8px 2px 0;line-height:1.5}
  .price-big{font-size:22px;font-weight:800;color:var(--brand);margin:2px 0 10px}
  .price-big small{font-size:12px;font-weight:500;color:var(--muted)}

  @media (max-width:820px){
    #topbar{flex-wrap:wrap;gap:8px;padding:8px 10px}
    .brand{order:1} .brand small{display:none} .brand h1{line-height:1.3}
    .brand .mark{width:30px;height:30px;border-radius:9px;font-size:14px}
    .btn{order:2;padding:6px 9px;font-size:11.5px}
    #topbar::after{content:'';flex-basis:100%;height:0;order:3}   /* paksa baris kedua */
    #stats{order:5;flex:1 1 0;min-width:0;width:auto;margin-left:0;justify-content:flex-start;flex-wrap:nowrap;
      overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .seg{order:4;flex:0 0 auto}
    .seg button{padding:7px 9px;font-size:11px}
    #stats::-webkit-scrollbar{display:none}
    #stats .stat{min-width:60px;padding:5px 9px;flex:0 0 auto}
    #stats .stat b{font-size:14px}
    .brand h1{font-size:12.5px}
    #sidebar{top:auto;bottom:0;left:0;right:0;width:100%;max-width:none;height:56vh;border-radius:16px 16px 0 0}
    #sidebar.hidden{transform:translateY(110%)}
    #mapwrap{bottom:auto;top:112px;right:10px;padding:7px}
    #minimap{width:104px;height:142px}
    #hint{top:auto;bottom:160px;font-size:12px;white-space:normal;max-width:86vw;text-align:center}
    #joy{width:112px;height:112px}
    #sidebar:not(.hidden) ~ #hint, #sidebar:not(.hidden) ~ #joy{display:none}
    form .grid2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ======================= 2D OVERLAY UI ======================= -->
<div id="ui">
  <div id="topbar" class="pe">
    <div class="brand">
      <div class="mark">W</div>
      <div>
        <h1>Wolfpup Virtual Mall</h1>
        <small data-i18n="brand.sub">Ground Floor &middot; Leasing Center</small>
      </div>
    </div>
    <div id="stats">
      <div class="stat"><b id="st-total">0</b><span data-i18n="stat.units">Units</span></div>
      <div class="stat ok"><b id="st-avail">0</b><span data-i18n="stat.available">Available</span></div>
      <div class="stat book"><b id="st-booked">0</b><span data-i18n="stat.reserved">Reserved</span></div>
      <div class="stat rent"><b id="st-rented">0</b><span data-i18n="stat.leased">Leased</span></div>
      <div class="stat"><b id="st-occ">0%</b><span data-i18n="stat.occupancy">Occupancy</span></div>
    </div>
    <div class="seg pe" id="langseg">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="id" aria-pressed="false">ID</button>
    </div>
    <button class="btn ghost" id="btn-list" data-i18n="btn.directory">Directory</button>
    <button class="btn ghost" id="btn-map" data-i18n="btn.map">Map</button>
    <button class="btn ghost" id="btn-help">?</button>
  </div>

  <aside id="sidebar" class="pe">
    <div class="side-head">
      <div class="tabs" id="tabs">
        <button data-tab="spaces" aria-pressed="true" data-i18n="tab.spaces">Spaces for rent</button>
        <button data-tab="products" aria-pressed="false" data-i18n="tab.products">Products</button>
      </div>
      <input id="search" type="search" data-i18n-placeholder="search.spaces" placeholder="Search unit, category, or tenant…" autocomplete="off">
      <div class="chips" id="filters">
        <button class="chip" data-filter="all" aria-pressed="true" data-i18n="filter.all">All</button>
        <button class="chip" data-filter="available" aria-pressed="false" data-i18n="filter.available">Available</button>
        <button class="chip" data-filter="booked" aria-pressed="false" data-i18n="filter.booked">Reserved</button>
        <button class="chip" data-filter="rented" aria-pressed="false" data-i18n="filter.rented">Leased</button>
      </div>
    </div>
    <div id="unitlist"></div>
    <div id="side-foot" style="padding:10px;border-top:1px solid var(--stroke);display:flex;gap:8px">
      <button class="btn ghost" id="btn-export" style="flex:1" data-i18n="btn.export">Export bookings</button>
      <button class="btn ghost" id="btn-reset" style="flex:1" data-i18n="btn.reset">Reset bookings</button>
    </div>
  </aside>

  <div id="mapwrap" class="pe">
    <div class="cap"><span data-i18n="map.title">Floor plan</span><span id="map-pos">0, 0</span></div>
    <canvas id="minimap" width="150" height="205"></canvas>
  </div>

  <div id="hint"></div>
  <div id="joy" class="pe"><div class="knob"></div></div>
  <div id="toasts"></div>

  <!-- unit detail + rental form -->
  <div id="modal" class="pe" role="dialog" aria-modal="true">
    <div class="sheet" id="sheet"></div>
  </div>

  <!-- product showcase + AR -->
  <div id="pmodal" class="pe" role="dialog" aria-modal="true">
    <div class="sheet" id="psheet"></div>
  </div>

  <!-- welcome / controls -->
  <div id="welcome" class="pe">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <h2 data-i18n="welcome.title">Welcome to Wolfpup Virtual Mall</h2>
          <p data-i18n="welcome.sub">A 3D mall you can walk through — every empty unit is ready to rent, and every product can be viewed in AR.</p>
        </div>
      </div>
      <div class="sheet-body">
        <ul id="welcome-list"></ul>
        <div class="legend">
          <span><i style="background:#36d399"></i><span data-i18n="legend.available">Available</span></span>
          <span><i style="background:#5aa9ff"></i><span data-i18n="legend.booked">Reserved by you</span></span>
          <span><i style="background:#ff5d7a"></i><span data-i18n="legend.rented">Leased</span></span>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn primary" id="btn-enter" data-i18n="btn.enter">Enter the mall</button>
      </div>
    </div>
  </div>
</div>

<!-- ======================= 3D SCENE ======================= -->
<a-scene id="scene" shadow="type: pcfsoft" renderer="colorManagement: true; antialias: true; physicallyCorrectLights: true"
         vr-mode-ui="enabled: true" loading-screen="dotsColor: #ffb020; backgroundColor: #0b0d12">

  <a-assets timeout="20000">
    <a-asset-item id="porsche-model" src="assets/Porsche%20356B.glb"></a-asset-item>
  </a-assets>

  <a-sky color="#9fb7d4"></a-sky>
  <a-entity light="type: hemisphere; color: #dfeaff; groundColor: #6b6257; intensity: 0.85"></a-entity>
  <a-entity light="type: ambient; color: #ffffff; intensity: 0.45"></a-entity>
  <a-entity light="type: directional; color: #fff4e0; intensity: 0.75; castShadow: false"
            position="14 26 12"></a-entity>

  <!-- pemain -->
  <a-entity id="rig">
    <a-camera id="cam" position="0 1.6 28" wasd-controls="acceleration: 45; fly: false"
              look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: true"
              mall-controls>
      <a-cursor color="#ffb020" raycaster="objects: .clickable; far: 26"
                fuse="false" scale="0.7 0.7 0.7"
                animation__click="property: scale; startEvents: click; from: 0.25 0.25 0.25; to: 0.7 0.7 0.7; dur: 180">
      </a-cursor>
    </a-camera>
  </a-entity>

  <!-- struktur mall dibangun oleh script -->
  <a-entity id="mall-structure"></a-entity>
  <a-entity id="mall-units"></a-entity>
  <a-entity id="mall-props"></a-entity>
</a-scene>

<script>
/* =====================================================================
   WOLFPUP VIRTUAL MALL — walkable mall + leasing (sewa space)
   Semua geometri mall dibangun secara prosedural (tanpa model eksternal)
   ===================================================================== */
(function () {
  'use strict';

  /* ------------------------------ konfigurasi ------------------------------ */
  var MALL      = { minX: -20, maxX: 20, minZ: -36, maxZ: 32 };
  var FRONT_L   = -7, FRONT_R = 7;          // garis etalase kiri & kanan (lebar koridor 14 m)
  var DOOR_W    = 3.4;                      // lebar pintu masuk unit
  var WALL_H    = 5;                        // tinggi partisi unit

  var rupiah = function (n) {

  var shortRp = function (n) {
    if (lang === 'id') {
      if (n >= 1e9) return 'Rp ' + (n / 1e9).toFixed(n % 1e9 === 0 ? 0 : 1) + ' M';
      if (n >= 1e6) return 'Rp ' + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + ' jt';
    } else {
      if (n >= 1e9) return 'Rp ' + (n / 1e9).toFixed(n % 1e9 === 0 ? 0 : 1) + ' bn';
      if (n >= 1e6) return 'Rp ' + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + ' mn';
    }

  /* ---------------------------- bangun data unit ---------------------------- */
  function buildData() {
    ROW_DEFS.forEach(function (d) {
      var facing = d.row === 'L' ? 1 : -1;               // arah hadap etalase (ke koridor)
      var front  = d.row === 'L' ? FRONT_L : FRONT_R;
      var dz     = 8;
      var cx     = front - facing * (d.depth / 2);
      var cz     = Z_SLOTS[d.slot];
      var area   = d.depth * dz;
      var rate   = RATES[d.zone];
      var u = {
        id: d.code, kind: 'shop', name: 'Space ' + d.code, cat: d.cat, tagline: d.tagline,
        baseStatus: d.status, tenant: d.tenant,
        cx: cx, cz: cz, dx: d.depth, dz: dz, facing: facing, front: front,
        width: dz, depth: d.depth, area: area, zone: d.zone,
        rate: rate, monthly: Math.round(area * rate / 100000) * 100000,
        service: Math.round(area * SERVICE_CHARGE / 100000) * 100000,
        facilities: FACILITIES_UNIT, products: [], refs: {}
      };
      UNITS.push(u); BY_ID[u.id] = u;
    });

    KIOSK_DEFS.forEach(function (d) {
      var area = d.size * d.size;
      var u = {
        id: d.code, kind: 'kiosk', name: 'Kiosk ' + d.code, cat: d.cat, tagline: d.tagline,
        baseStatus: d.status, tenant: d.tenant,

        width: d.size, depth: d.size, area: area, zone: 'kiosk',
        rate: RATES.kiosk, monthly: Math.round(area * RATES.kiosk / 100000) * 100000,
        service: Math.round(area * SERVICE_CHARGE / 100000) * 100000,

    PRODUCT_DEFS.forEach(function (d) {

  /* ------------------------------- helper 3D -------------------------------- */
  function make(tag, attrs, parent) {
    var e = document.createElement(tag);
    for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  // box(parent, x, y, z, w, h, d, color, opts)
  function box(parent, x, y, z, w, h, d, color, opts) {
    opts = opts || {};
    var attrs = {
      position: x + ' ' + y + ' ' + z,
      width: w, height: h, depth: d, color: color,
      shadow: 'cast: ' + (opts.cast === true) + '; receive: ' + (opts.receive !== false)
    };
    if (opts.opacity !== undefined) { attrs.opacity = opts.opacity; attrs.transparent = 'true'; }
    if (opts.metalness !== undefined) attrs.metalness = opts.metalness;
    if (opts.roughness !== undefined) attrs.roughness = opts.roughness;
    if (opts.cls) attrs['class'] = opts.cls;
    var e = make('a-box', attrs, parent);
    if (opts.collide && (y - h / 2) < 2.2) {
      var o = opts.origin || [0, 0];   // box bisa berada di dalam entity anak
      COLLIDERS.push({
        x1: o[0] + x - w / 2, x2: o[0] + x + w / 2,
        z1: o[1] + z - d / 2, z2: o[1] + z + d / 2
      });
    }
    return e;
  }
  // teks 3D yang nilainya mengikuti kunci bahasa
  function i18nText(el, key) { I18N_3D.push({ el: el, key: key }); el.setAttribute('value', t(key)); return el; }
  function text(parent, value, x, y, z, rotY, opts) {
    opts = opts || {};
    return make('a-text', {
      value: value, position: x + ' ' + y + ' ' + z, rotation: '0 ' + rotY + ' 0',
      align: opts.align || 'center', color: opts.color || '#ffffff',
      width: opts.width || 6, 'baseline': opts.baseline || 'center',
      'wrap-count': opts.wrap || 28
    }, parent);
  }

  function buildStructure() {

    var W = MALL.maxX - MALL.minX, D = MALL.maxZ - MALL.minZ;

    // lantai utama + runner koridor
    make('a-plane', {
      position: cx + ' 0 ' + cz, rotation: '-90 0 0', width: W, height: D,
      color: '#d8d2c6', roughness: 0.9, shadow: 'receive: true'
    }, root);
    make('a-plane', {
      position: '0 0.02 ' + cz, rotation: '-90 0 0', width: 13.6, height: D,
      color: '#efe9dd', roughness: 0.75
    }, root);
    // garis pola koridor
    for (var z = MALL.minZ + 4; z < MALL.maxZ; z += 6) {
      make('a-plane', { position: '0 0.03 ' + z, rotation: '-90 0 0', width: 13.6, height: 0.35, color: '#c9b892' }, root);
    }
    // apron di depan tiap etalase
    make('a-plane', { position: (FRONT_L + 1.1) + ' 0.03 ' + cz, rotation: '-90 0 0', width: 2.2, height: D, color: '#b9b0a0' }, root);
    make('a-plane', { position: (FRONT_R - 1.1) + ' 0.03 ' + cz, rotation: '-90 0 0', width: 2.2, height: D, color: '#b9b0a0' }, root);

    // dinding luar
    var wallColor = '#e7e2d8';
    box(root, MALL.minX - 0.25, 3, cz, 0.5, 6, D, wallColor, { collide: true });          // barat
    box(root, MALL.maxX + 0.25, 3, cz, 0.5, 6, D, wallColor, { collide: true });          // timur
    box(root, cx, 3, MALL.minZ - 0.25, W + 1, 6, 0.5, wallColor, { collide: true });      // utara
    // selatan (dengan bukaan pintu masuk selebar 12 m)

    box(root,  13, 3, MALL.maxZ + 0.25, 14, 6, 0.5, wallColor, { collide: true });

    make('a-plane', { position: ((MALL.maxX + FRONT_R) / 2) + ' ' + CEIL_Y + ' ' + cz, rotation: '90 0 0', width: (MALL.maxX - FRONT_R), height: D, color: '#f2efe8' }, root);
    for (var bz = MALL.minZ + 3; bz < MALL.maxZ; bz += 6) {
      box(root, 0, CEIL_Y - 0.2, bz, 14.2, 0.4, 0.55, '#dcd6ca', { cast: false });
    }
    // strip lampu plafon
    for (var lz = MALL.minZ + 5; lz < MALL.maxZ; lz += 8) {
      make('a-box', { position: (FRONT_L - 4) + ' ' + (CEIL_Y - 0.12) + ' ' + lz, width: 8, height: 0.08, depth: 0.5, color: '#fff6df', emissive: '#fff3d0', 'emissive-intensity': 0.9 }, root);
      make('a-box', { position: (FRONT_R + 4) + ' ' + (CEIL_Y - 0.12) + ' ' + lz, width: 8, height: 0.08, depth: 0.5, color: '#fff6df', emissive: '#fff3d0', 'emissive-intensity': 0.9 }, root);
    }
    // pencahayaan koridor
    [20, 4, -12, -28].forEach(function (pz) {
      make('a-entity', { light: 'type: point; intensity: 0.42; distance: 26; color: #ffeccd', position: '0 5 ' + pz }, root);

      box(esc,  2.2, 0.25 + s * 0.28, -s * 0.55, 3.4, 0.5 + s * 0.56, 0.55, s % 2 ? '#a9b0be' : '#98a0ae', {});
    }
    box(esc, 0, 4.4, -2.6, 13, 0.3, 6, '#cfd5df', { cast: false });

    make('a-cylinder', { position: '0 0.35 0', radius: 2.6, height: 0.7, color: '#c3ccd8', shadow: 'receive: true' }, f);
    make('a-cylinder', { position: '0 0.72 0', radius: 2.3, height: 0.08, color: '#4fa8d8', opacity: 0.85, transparent: 'true' }, f);

      animation: 'property: position; to: 0 2.6 0; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine' }, f);
    COLLIDERS.push({ x1: -2.7, x2: 2.7, z1: -2.7, z2: 2.7 });

    // papan direktori dekat pintu masuk
    var dir = make('a-entity', { position: '-4.6 0 27' }, root);

    i18nText(text(dir, '', 0.2, 2.5, 0, 90, { width: 3.4, color: '#ffb020' }), 'w3.dirTitle');
    i18nText(text(dir, '', 0.2, 1.4, 0, 90, { width: 3, color: '#dfe5f0' }), 'w3.dirBody');

    // bangku & planter sepanjang koridor
    var props = document.getElementById('mall-props');
    [22, 13, -1, -10, -19, -28].forEach(function (pz, i) {
      var sx = i % 2 === 0 ? -4.2 : 4.2;
      box(props, sx, 0.45, pz, 1.1, 0.16, 2.6, '#8a6f52', { collide: true });

  var ACCENTS = {
    food: '#e6c184', fashion: '#d3a3c2', tech: '#8fb9df', auto: '#a6adbb', beauty: '#e8b6c6',

  // memasang satu produk di atas booth/etalase: model 3D + label + area klik
  function mountProduct(parent, pr, x, y, z, rotY, hit) {
    // alas pajangan kecil supaya produk terbaca sebagai display
    make('a-cylinder', { position: x + ' ' + (y + 0.03) + ' ' + z, radius: 0.34, height: 0.06,
      color: '#2a2f3a', metalness: 0.3, roughness: 0.5 }, parent);
    var sc = pr.scale * (pr.show || 1);       // ukuran pajangan (AR tetap skala asli)
    var spin = make('a-entity', {
      position: x + ' ' + (y + 0.06 + pr.lift * (pr.show || 1)) + ' ' + z,
      animation: 'property: rotation; to: 0 360 0; loop: true; dur: 18000; easing: linear'
    }, parent);
    make('a-gltf-model', {
      src: pr.model, scale: sc + ' ' + sc + ' ' + sc, shadow: 'cast: true'
    }, spin);

    var label = text(parent, '', x, y + (hit ? hit.labelY || 0.75 : 0.75), z, rotY, { width: 2.2, color: '#ffffff' });
    PRODUCT_LABELS.push({ el: label, product: pr });
    refreshProductLabel(label, pr);

    var hw = (hit && hit.w) || 0.7, hh = (hit && hit.h) || 0.55, hd = (hit && hit.d) || 0.7;
    var target = make('a-box', {
      position: x + ' ' + (y + hh / 2) + ' ' + z, width: hw, height: hh, depth: hd,
      opacity: 0.001, transparent: 'true', 'class': 'clickable'
    }, parent);
    target.addEventListener('click', function () { openProduct(pr.id); });
    target.addEventListener('mouseenter', function () {
      hovered = null; hoveredProduct = pr;
      showHint(t('hint.product', { name: '<b>' + esc(L(pr.name)) + '</b>', price: shortRp(pr.price) }));
    });
    target.addEventListener('mouseleave', function () { if (hoveredProduct === pr) hoveredProduct = null; hideHint(); });
    return spin;
  }

  function refreshProductLabel(el, pr) {
    el.setAttribute('value', L(pr.name).toUpperCase() + '\n' + shortRp(pr.price));
  }

  function buildShop(u, root) {
    var e = make('a-entity', { position: u.cx + ' 0 ' + u.cz, id: 'unit-' + u.id }, root);
    var fx = u.facing * (u.dx / 2);                  // x etalase relatif ke pusat unit
    var bx = -fx;                                    // x dinding belakang
    var rotY = u.facing > 0 ? 90 : -90;              // rotasi menghadap koridor
    var org = [u.cx, u.cz];

    // lantai unit
    make('a-plane', { position: '0 0.04 0', rotation: '-90 0 0', width: u.dx, height: u.dz, color: '#efe6d8', roughness: 0.85 }, e);
    // dinding belakang + samping
    box(e, bx, WALL_H / 2, 0, 0.3, WALL_H, u.dz, '#e3ded4', { collide: true, origin: org });
    box(e, 0, WALL_H / 2, -u.dz / 2, u.dx, WALL_H, 0.3, '#ded8cd', { collide: true, origin: org });
    box(e, 0, WALL_H / 2,  u.dz / 2, u.dx, WALL_H, 0.3, '#ded8cd', { collide: true, origin: org });

    // etalase kaca (dua panel, menyisakan pintu di tengah)
    var panelW = (u.dz - DOOR_W) / 2;
    [-1, 1].forEach(function (sgn) {
      var pz = sgn * (DOOR_W / 2 + panelW / 2);
      box(e, fx, 2.1, pz, 0.18, 4.2, panelW, '#9fc6dd', { collide: true, origin: org, opacity: 0.16, metalness: 0.2, roughness: 0.05 });
      box(e, fx, 0.15, pz, 0.3, 0.3, panelW, '#6c7484', { collide: false });
      // area klik unit: hanya di atas kaca, supaya pintu tetap bisa ditembus sinar kursor
      var hit = make('a-plane', {
        position: (fx + u.facing * 0.55) + ' 2.2 ' + pz, rotation: '0 ' + rotY + ' 0',
        width: panelW, height: 4.4, opacity: 0.001, transparent: 'true', side: 'double',
        'class': 'clickable'
      }, e);
      wireInteraction(hit, u);
    });
    // kusen pintu + bulkhead atas

  window.JOY = { x: 0, y: 0 };
  var controls = null;    // instance komponen jalan kaki
  AFRAME.registerComponent('mall-controls', {
    init: function () {
      this.prev = new THREE.Vector3(0, 1.6, 28);
      this.radius = 0.4;
      controls = this;
    },
    // pindah ke satu titik, pastikan tidak berakhir di dalam objek
    place: function (x, z) {
      var p = this.el.object3D.position;
      p.set(x, 1.6, z);
      this.clamp(p);
      if (this.inside(p.x, p.z)) this.pushOut(p);
      this.clamp(p);
      this.prev.set(p.x, 1.6, p.z);
    },
    inside: function (x, z) {
      var r = this.radius;
      for (var i = 0; i < COLLIDERS.length; i++) {
        var c = COLLIDERS[i];
        if (x > c.x1 - r && x < c.x2 + r && z > c.z1 - r && z < c.z2 + r) return true;
      }
      return false;
    },
    clamp: function (p) {
      var m = 0.45;
      p.x = Math.max(MALL.minX + m, Math.min(MALL.maxX - m, p.x));
      p.z = Math.max(MALL.minZ + m, Math.min(MALL.maxZ - m, p.z));
    },
    // dipakai kalau pemain "nyangkut" di dalam objek (mis. teleport dari denah)
    pushOut: function (p) {
      var r = this.radius;
      for (var i = 0; i < COLLIDERS.length; i++) {
        var c = COLLIDERS[i];
        var x1 = c.x1 - r, x2 = c.x2 + r, z1 = c.z1 - r, z2 = c.z2 + r;
        if (p.x > x1 && p.x < x2 && p.z > z1 && p.z < z2) {
          var dL = p.x - x1, dR = x2 - p.x, dB = p.z - z1, dT = z2 - p.z;
          var min = Math.min(dL, dR, dB, dT);
          if (min === dL) p.x = x1; else if (min === dR) p.x = x2;
          else if (min === dB) p.z = z1; else p.z = z2;
        }
      }
    },
    tick: function (time, delta) {
      var p = this.el.object3D.position;
      var dt = Math.min(delta || 16, 60) / 1000;
      var prev = this.prev;

      // gerak joystick (mobile)
      if (window.JOY.x || window.JOY.y) {
        var yaw = this.el.object3D.rotation.y;
        var speed = 4.6 * dt, fwd = -window.JOY.y, str = window.JOY.x;
        p.x += (-Math.sin(yaw) * fwd + Math.cos(yaw) * str) * speed;
        p.z += (-Math.cos(yaw) * fwd - Math.sin(yaw) * str) * speed;
      }
      p.y = 1.6;
      this.clamp(p);

      if (this.inside(p.x, p.z)) {
        if (!this.inside(prev.x, p.z)) p.x = prev.x;              // geser menyusuri dinding
        else if (!this.inside(p.x, prev.z)) p.z = prev.z;
        else if (!this.inside(prev.x, prev.z)) { p.x = prev.x; p.z = prev.z; }
        else this.pushOut(p);                                      // terjebak -> dorong keluar
        this.clamp(p);
      }
      if (!this.inside(p.x, p.z)) prev.set(p.x, 1.6, p.z);
    }
  });

      pz = u.cz;

        var offsets = [4.2, 3.2, 5.4, 2.6, 6.2];
        for (var i = 0; i < offsets.length; i++) {
          var cand = u.front + u.facing * offsets[i];
          if (!controls.inside(cand, pz)) { px = cand; break; }

      }
    } else { px = 0; pz = u.cz + 6.2; }
    if (controls) controls.place(px, pz); else cam.object3D.position.set(px, 1.6, pz);
    px = cam.object3D.position.x; pz = cam.object3D.position.z;
    var dx = u.cx - px, dz = u.cz - pz;

  function calcRent(u, months) {
    var disc = DISCOUNTS[months] || 0;
    var perMonth = u.monthly + u.service;
    var subtotal = perMonth * months;
    var discount = Math.round(subtotal * disc);
    return {
      months: months, perMonth: perMonth, subtotal: subtotal, disc: disc, discount: discount,
      total: subtotal - discount, deposit: u.monthly * DEPOSIT_MONTHS
    };
  }

  function addMonths(iso, months) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) d = new Date();
    var day = d.getDate();
    d.setMonth(d.getMonth() + months);
    if (d.getDate() !== day) d.setDate(0);
    return d.toISOString().slice(0, 10);
  }

  function bindForm(u) {
    var form = $('#rent-form'), sum = $('#f-summary');
    function refresh() {
      var months = parseInt(form.months.value, 10) || 12;
      var c = calcRent(u, months);
      sum.innerHTML =
        '<div class="line"><span>' + t('sum.rentService', { rent: shortRp(u.monthly), service: shortRp(u.service) }) +
          '</span><b>' + rupiah(c.perMonth) + ' ' + t('sum.perMonth') + '</b></div>' +
        '<div class="line"><span>' + t('sum.duration') + '</span><b>' + months + ' ' + t('form.monthsUnit') + '</b></div>' +
        (c.disc ? '<div class="line"><span>' + t('sum.discount') + '</span><b>- ' + rupiah(c.discount) + '</b></div>' : '') +
        '<div class="line"><span>' + t('sum.deposit', { n: DEPOSIT_MONTHS }) + '</span><b>' + rupiah(c.deposit) + '</b></div>' +
        '<div class="line"><span>' + t('sum.end') + '</span><b>' + addMonths(form.start.value, months) + '</b></div>' +
        '<div class="line total"><span>' + t('sum.total') + '</span><b>' + rupiah(c.total) + '</b></div>';
    }
    form.addEventListener('input', refresh);
    form.addEventListener('change', refresh);
    form.addEventListener('submit', function (e) { e.preventDefault(); submitRent(u.id); });
    refresh();
  }

  function submitRent(id) {

  /* --------------------------------- denah ---------------------------------- */
  var canvas = $('#minimap'), ctx = canvas.getContext('2d');
  function mapScale() {
    return { sx: canvas.width / (MALL.maxX - MALL.minX), sz: canvas.height / (MALL.maxZ - MALL.minZ) };
  }
  function toMap(x, z) {
    var s = mapScale();
    return [(x - MALL.minX) * s.sx, (z - MALL.minZ) * s.sz];
  }
  function drawMap() {
    var s = mapScale();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // lantai + koridor
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    var c1 = toMap(FRONT_L, MALL.minZ);
    ctx.fillRect(c1[0], 0, (FRONT_R - FRONT_L) * s.sx, canvas.height);
    // unit
    UNITS.forEach(function (u) {
      var st = statusOf(u), meta = STATUS[st];
      var p = toMap(u.cx - u.dx / 2, u.cz - u.dz / 2);
      ctx.fillStyle = meta.color;
      ctx.globalAlpha = 0.78;
      ctx.fillRect(p[0], p[1], u.dx * s.sx, u.dz * s.sz);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.lineWidth = 1;
      ctx.strokeRect(p[0] + .5, p[1] + .5, u.dx * s.sx - 1, u.dz * s.sz - 1);
      if (u.kind === 'shop') {
        ctx.fillStyle = 'rgba(10,12,18,.85)';
        ctx.font = '700 8px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(u.id, p[0] + (u.dx * s.sx) / 2, p[1] + (u.dz * s.sz) / 2);
      }
    });
    // air mancur
    var f = toMap(0, 0);
    ctx.fillStyle = 'rgba(126,200,239,.8)';
    ctx.beginPath(); ctx.arc(f[0], f[1], 2.6 * s.sx, 0, Math.PI * 2); ctx.fill();
    // pintu masuk
    var en = toMap(-6, MALL.maxZ - 0.6);
    ctx.fillStyle = '#ffb020';
    ctx.fillRect(en[0], en[1], 12 * s.sx, 2);
    // pemain
    var cam = $('#cam');
    if (cam && cam.object3D) {
      var pos = cam.object3D.position, yaw = cam.object3D.rotation.y;
      var pp = toMap(pos.x, pos.z);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(pp[0], pp[1]);
      ctx.lineTo(pp[0] - Math.sin(yaw) * 12, pp[1] - Math.cos(yaw) * 12);
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(pp[0], pp[1], 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#0b0d12'; ctx.lineWidth = 1; ctx.stroke();
      $('#map-pos').textContent = Math.round(pos.x) + ', ' + Math.round(pos.z);
    }
  }
  canvas.addEventListener('click', function (ev) {
    var rect = canvas.getBoundingClientRect();
    var s = mapScale();
    var x = MALL.minX + ((ev.clientX - rect.left) / rect.width) * canvas.width / s.sx;
    var z = MALL.minZ + ((ev.clientY - rect.top) / rect.height) * canvas.height / s.sz;
    var cam = $('#cam');
    if (!cam) return;
    if (controls) controls.place(x, z); else cam.object3D.position.set(x, 1.6, z);
    toast(t('toast.moved', { x: Math.round(cam.object3D.position.x), z: Math.round(cam.object3D.position.z) }));
  });

  /* -------------------------------- joystick -------------------------------- */
  function initJoystick() {
    var joy = $('#joy'), knob = joy.querySelector('.knob'), id = null, R = 44;
    function set(dx, dy) {
      var d = Math.hypot(dx, dy);
      if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      window.JOY.x = dx / R; window.JOY.y = dy / R;
    }
    function reset() { id = null; knob.style.transform = ''; window.JOY.x = 0; window.JOY.y = 0; }
    joy.addEventListener('pointerdown', function (e) {
      id = e.pointerId; joy.setPointerCapture(id);
      var r = joy.getBoundingClientRect();
      set(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    });
    joy.addEventListener('pointermove', function (e) {
      if (e.pointerId !== id) return;
      var r = joy.getBoundingClientRect();
      set(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (evt) {
      joy.addEventListener(evt, function (e) { if (e.pointerId === id) reset(); });
    });
  }

    $('#btn-help').addEventListener('click', function () { $('#welcome').style.display = 'grid'; });

    $('#btn-export').addEventListener('click', exportBookings);

    $('#search').addEventListener('input', function (e) { searchTerm = e.target.value; renderList(); });
    $('#filters').addEventListener('click', function (e) {

        c.setAttribute('aria-pressed', String(c.getAttribute('data-filter') === f));
      });
      renderList();
    });

    document.addEventListener('keydown', function (e) {
      var t = e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      var k = e.key.toLowerCase();
      if (k === 'escape') {
        if (pmodalEl.classList.contains('open')) { pmodalEl.classList.remove('open'); openProductId = null; }
        else if (modalEl.classList.contains('open')) { modalEl.classList.remove('open'); openUnitId = null; }
        else if ($('#welcome').style.display !== 'none') $('#welcome').style.display = 'none';
      } else if (k === 'e' && hoveredProduct) { openProduct(hoveredProduct.id); }
      else if (k === 'e' && hovered) { openUnit(hovered.id); }
      else if (k === 'm') { $('#mapwrap').classList.toggle('hidden'); }
      else if (k === 'l') { $('#sidebar').classList.toggle('hidden'); }
    });

    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      document.body.classList.add('touch');
      initJoystick();
    }
    if (window.matchMedia('(max-width: 820px)').matches) $('#sidebar').classList.add('hidden');
  }

  function loop() {
    drawMap();
    setTimeout(function () { requestAnimationFrame(loop); }, 60);
  }

  function init() {
    var saved = null;
    try { saved = localStorage.getItem(LS_LANG); } catch (e) {}
    lang = saved === 'id' ? 'id' : 'en';     // bahasa default: English

    buildData();
    buildStructure();
    buildUnits();
    initUI();
    applyLang(lang);
    // pastikan komponen jalan kaki aktif (didaftarkan setelah scene di-parse)
    var cam = document.getElementById('cam');
    if (cam) cam.setAttribute('mall-controls', '');
    loop();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
